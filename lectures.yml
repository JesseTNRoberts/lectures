# Published lectures, one list per course. The course id (AI4200) must match `course_id` in the
# site's _teaching/ file. Paths are relative to this repo. The site's Teaching page and course pages
# read this file, so a new entry shows up about a minute after you push.
#
# Fields: week, session (optional), date (optional, YYYY-MM-DD), title, topics, slides, notebook,
# pdf, video, note, readings (title, authors, year, venue, url), demos, models.
# Copy an entry below to add one. Indentation matters (two spaces).

